source = ~/.config/hypr/hyprlock-colors.conf

# BACKGROUND
background {
    monitor =
#    blur_size = 4
#    blur_passes = 3
    path = $HOME/current_wallpaper/background.jpg
}

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = $text_color
  font_size = 22
  font_family = Hack Nerd Font
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%H:%M")"
  color = $text_color
  font_size = 95
  font_family = Hack Nerd Font
  position = 0, 200
  halign = center
  valign = center
}

# MUSIC
label {
  monitor = 
  text = cmd[update:100] bash ~/.config/hypr/scripts/hyprlock-music.sh --title
  color = $text_color
  font_size = 30
  font_family = Hack Nerd Font
  position = 600, 20
  halign = center
  valign = center
}
label {
  monitor = 
  text = cmd[update:100] bash ~/.config/hypr/scripts/hyprlock-music.sh --artist
  color = $text_color
  font_size = 20
  font_family = Hack Nerd Font
  position = 600, -20
  halign = center
  valign = center
}
label {
  monitor = 
  text = cmd[update:100] bash ~/.config/hypr/scripts/hyprlock-music.sh --progress-bar
  color = $text_color
  font_size = 20
  font_family = Hack Nerd Font
  position = 600, -50
  halign = center
  valign = center
}
image {
    monitor =
    path = /home/lucas/.cache/hyprlock-art/034f76d18166d8b1ef16dfdb64b1721ac0631c67bc818a91e4880a54cb7b2678_sq_1024.jpg
    size = 250
    rounding = 250 # no rounding

    position = 600, 120
    halign = center
    valign = center
}
# PSWD PROMPT
input-field {
    monitor =
    size = 270, 60
    outline_thickness = 2
    outer_color = $entry_color
    inner_color = $background
    font_color = $text_color
    fade_on_empty = false
    rounding = 12
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    check_color = rgba(255, 255, 255, 1)
    placeholder_text = <i><span>Enter your Password</span></i>
    hide_input = false
    font_family = Hack Nerd Font
    position = 0, -300
    halign = center
    valign = center
}

# WEATHER
label {
  monitor =
  text = cmd[update:1500] bash ~/.config/scripts/hyprlock_weather.sh
  color = $text_color
  font_size = 18
  color = rgba(203, 166, 247, 1)
  font_family = Hack Nerd Font
  position = 0, -450
  halign = center
  valign = center
}
