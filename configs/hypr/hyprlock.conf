# Hyprlock — minimal dark lockscreen
# Designed for a dark Hyprland setup with dynamic wallpapers.

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 2
    fail_timeout = 1400
}

auth {
    pam:enabled = true
}

animations {
    enabled = true

    bezier = smooth, 0.22, 1, 0.36, 1
    bezier = fade, 0.4, 0, 0.2, 1

    animation = fadeIn, 1, 3.5, fade
    animation = fadeOut, 1, 2.5, fade
    animation = inputFieldDots, 1, 2.5, smooth
    animation = inputFieldColors, 1, 2.5, smooth
}

# Keep this independent from the wallpaper script:
# Hyprlock snapshots the current session and turns it into a clean backdrop.
background {
    monitor =
    path = screenshot

    color = rgba(0d0d0fff)

    blur_passes = 3
    blur_size = 8
    noise = 0.008
    contrast = 1.05
    brightness = 0.48
    vibrancy = 0.10
    vibrancy_darkness = 0.15
}

# Clock
label {
    monitor =
    text = $TIME

    color = rgba(f2f2f2ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font

    position = 0, 155
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date '+%A %d %B'

    color = rgba(c8c8c8ff)
    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = 0, 95
    halign = center
    valign = center
}

# Identity — intentionally small and understated.
label {
    monitor =
    text = cmd[update:0] printf '%s@%s' "$USER" "$(hostname)"

    color = rgba(a9a9a9ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font

    position = 0, -15
    halign = center
    valign = center
}

input-field {
    monitor =

    size = 320, 48
    outline_thickness = 1

    dots_size = 0.20
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(ffffff26)
    inner_color = rgba(101014cc)
    font_color = rgba(f2f2f2ff)

    check_color = rgba(dddddd55)
    fail_color = rgba(d65d5d88)
    capslock_color = rgba(d6b85d88)

    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false

    placeholder_text = <span foreground="##9a9a9a">password</span>
    fail_text = <span foreground="##d98989">$FAIL</span>

    rounding = 12

    position = 0, -75
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000055)
}

# Small hint, no visual noise.
label {
    monitor =
    text = esc  cancel

    color = rgba(858585ff)
    font_size = 10
    font_family = JetBrainsMono Nerd Font

    position = 0, 35
    halign = center
    valign = bottom
}
