$CITY             = Bourges 
$COUNTRY          = France
$WALLPAPER_PATH   = ~/current_wallpaper/background.jpg

# COLORS (from hyprlock-colors.conf - generated by matugen)
$background             = rgba(26, 17, 17, 1)
$primary                = rgba(ffb3b3FF)
$text_color             = rgba(f0dedeFF)
$entry_background_color = rgba(1a1111CC)
$entry_border_color     = rgba(a08c8c55)
$entry_color            = rgba(ffdad9FF)
$font_family            = JetBrainsMono Nerd Font Mono

# BACKGROUND
background {
    path = $WALLPAPER_PATH
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    size = 170, 45
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = false
    outer_color = rgba(0, 0, 0, 0)
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = false
    font_family = $font_family
    placeholder_text = <span foreground="##ffffff99">Enter Password</span>
    hide_input = false
    position = 0, -425
    halign = center
    valign = center
}

# TIME
label {
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = $text_color
    font_size = 85
    font_family = $font_family
    position = 0, 310
    halign = center
    valign = center
}

# DAY-MONTH-DATE
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $text_color
    font_size = 30
    font_family = $font_family
    position = 0, 400
    halign = center
    valign = center
}

# PROFILE PHOTO
image {
    monitor =
    path = ~/current_pfp/pp.jpg 
    border_color = $primary
    border_size = 0
    size = 110
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, -265
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = $USER
    color = $text_color
    font_size = 20
    font_family = $font_family
    position = 0, -360
    halign = center
    valign = center
}

# CURRENT SONG (SPOTIFY ONLY)
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/scripts/spotify-playing.sh)"
    color = $text_color
    font_size = 18
    font_family = $font_family
    position = 100, 0
    halign = left
    valign = center
}

# WEATHERCAST & LOCATION
label {
    monitor      =
    text         = cmd[update:1000] echo "$(bash ~/.config/hypr/hyprlock/scripts/weather.sh)"
    shadow_passes = 1
    shadow_boost  = 0.5
    color         = $text_color
    font_size     = 18
    font_family   = $font_family
    position      = 95.5, -40
    halign        = left
    valign        = center
}
