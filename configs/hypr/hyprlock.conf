source = ~/.config/hypr/hyprlock-colors.conf

# BACKGROUND
background {
    monitor =
    blur_size = 4
    blur_passes = 3
    path = $HOME/current_wallpaper/background.jpg
}

general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = $text_color
  font_size = 22
  font_family = Hack Nerd Font
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%H:%M")"
  color = $text_color
  font_size = 95
  font_family = Hack Nerd Font
  position = 0, 200
  halign = center
  valign = center
}

# PSWD PROMPT
input-field {
    monitor =
    size = 270, 60
    outline_thickness = 2
    outer_color = $entry_color
    inner_color = $background
    font_color = $text_color
    fade_on_empty = false
    rounding = 12
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    check_color = rgba(255, 255, 255, 1)
    placeholder_text = <i><span>Enter your Password</span></i>
    hide_input = false
    font_family = Hack Nerd Font
    position = 0, -300
    halign = center
    valign = center
}

# WEATHER
label {
  monitor =
  text = cmd[update:1500] bash ~/.config/scripts/hyprlock_weather.sh
  color = $text_color
  font_size = 18
  color = rgba(203, 166, 247, 1)
  font_family = Hack Nerd Font
  position = 0, -450
  halign = center
  valign = center
}

# --- BARRE D'ÉTAT (Bas à droite - Une seule ligne) ---
label {
    monitor =
    # Commande combinée pour afficher Wifi | Volume | Batterie
    text = cmd[update:5000] echo "  $(nmcli -t -f active,ssid dev wifi | grep '^oui' | cut -d: -f2)  |    $(pamixer --get-volume-human)  |    $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgba(200, 200, 200, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    
    # Positionnement
    position = -30, 30
    halign = right
    valign = bottom
}
