########################################################################################
# HYPRLAND RETRO CONFIG (i3-STYLE)
########################################################################################

# --- MONITORS ---
monitor=,preferred,auto,1
monitor = HDMI-A-1, preferred, auto, 1, mirror, eDP-1

# --- MY PROGRAMS ---
$terminal = kitty
$fileManager = nautilus 
$menu = rofi -show drun
$ide = codium 

# --- AUTOSTART ---
exec-once = awww-daemon & hypridle & $terminal & swaync & udiskie -t & waybar

# --- ENVIRONMENT VARIABLES ---
env = XCURSOR_SIZE,30
env = XCURSOR_THEME,macOS

#####################
### LOOK AND FEEL ###
#####################

# Import des couleurs générées par Matugen
source = ~/.config/hypr/colors-hyprland.conf

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2 # Indispensable pour voir la couleur s'adapter
    
    # Utilisation des variables du template
    # On utilise $primary pour la bordure active (couleur principale du fond d'écran)
    col.active_border = $primary $accent 45deg
    
    # On utilise $surface ou $background pour la bordure inactive
    col.inactive_border = $surface

    layout = dwindle
}

decoration {
    # Look i3 : Pas d'arrondis
    rounding = 0
    
    active_opacity = 1.0
    inactive_opacity = 1.0 # i3 est généralement opaque
    
    dim_inactive = false
    
    shadow {
        enabled = false # Pas d'ombres pour un look "flat"
    }
    
    # BLUR CONSERVÉ TEL QUEL
    blur {
        enabled = true
        size = 6
        passes = 3
        noise = 0.006
        brightness = 1.03
        contrast = 1.02
        vibrancy = 0.25
        vibrancy_darkness = 0.6
        new_optimizations = true
        popups = true
        special = true
    }
}

animations {
    # Look i3 : Les fenêtres apparaissent instantanément
    enabled = false 
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2 # Split vers la droite/bas systématique comme i3
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

#############
### INPUT ###
#############

input {
    kb_layout = fr
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, space, exec, $menu
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, G, exec, hyprquickframe
bind = $mainMod, B, exec, $ide
bind = $mainMod, L, exec, wlogout -b 6
bind = $mainMod ALT, space, exec, ~/.config/rofi/mainmenu.sh
bind = $mainMod SHIFT, W, exec, ~/.config/rofi/wallpaper_selector.sh
bind = $mainMod SHIFT, T, exec, ~/.config/rofi/theme_selector.sh

# Focus i3-style
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

# Move to workspace
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10

# Move window
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

bind = $mainMod, S, togglespecialworkspace, magic
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = match:class org.gnome.Nautilus, float true, size 1000 650 
windowrule = match:class imv, float true, size 1000 650
windowrule = match:class obsidian, float true, size 850 650

xwayland {
  force_zero_scaling = true
}

plugin {
    hyprscrolling {
        column_width = 1.0
        fullscreen_on_one_column = false
        focus_fit_method = 1
    }
    hyprbars {
        # --- Apparence Générale ---
        bar_height = 23
        bar_color = $background          # Gris très sombre (fond)
        col.text = rgba(ffffffff)           # Texte blanc pur
        bar_text_size = 10
        bar_text_font = JetBrainsMono Nerd Font # Ou une police "Pixel" pour le look retro
        bar_text_align = center               # i3 aligne souvent à gauche

        # --- Boutons (Optionnel, i3 n'en a pas par défaut) ---
        # Si tu en veux quand même (R -> L) : color, size, icon, on-click
        hyprbars-button = rgb(ff5555), 12, 󰖭, hyprctl dispatch killactive
        
        # --- Comportement ---
        bar_buttons_alignment = right
        bar_padding = 10
        bar_precedence_over_border = true   # La barre remplace la bordure haute
    }
}

workspace = 3, layout:scrolling
